name: deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/convex/**"
      - "apps/nextjs/**"
      - "packages/**"
      - "pnpm-lock.yaml"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-convex:
    name: deploy convex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/convex
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup

      - name: deploy to convex
        run: pnpm convex deploy --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  trigger-vercel:
    name: trigger vercel deploy
    needs: [deploy-convex]
    runs-on: ubuntu-latest
    steps:
      - name: trigger vercel deploy hook
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
